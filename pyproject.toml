[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopdata"
version = "1.0.0"
description = "Synthetic e-commerce data and dbt models for analytics engineering"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shopdata = "shopdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
