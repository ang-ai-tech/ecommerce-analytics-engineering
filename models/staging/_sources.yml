version: 2

sources:
  - name: shop
    description: >
      Raw CSV exports from the store's systems (generated by `shopdata generate`),
      exposed as views in the `raw` schema by the create_raw_views macro.
      Every column is text: casting and cleaning happen only in staging.
    schema: raw
    tables:
      - name: customers
        description: Customer accounts. Can contain several versions of the same customer.
      - name: products
        description: Product catalogue with the current price.
      - name: orders
        description: One row per order; status is written in several different ways.
      - name: order_items
        description: Products in each order, with the price paid at the time.
      - name: web_events
        description: Website and app events (page views, cart, checkout, purchase).
